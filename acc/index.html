<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đang chuyển hướng...</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var params = new URLSearchParams(search);
      var id = params.get('id');

      var match = path.match(/\/acc\/([a-zA-Z0-9]+)/i);
      if (match && match[1] && match[1].toLowerCase() !== 'index.html') {
        var cleanId = match[1].replace(/^[#vlrVLR]+/i, '');
        window.location.replace('/acc/' + cleanId + (search ? search : ''));
        return;
      }

      if (id) {
        var cleanId = id.replace(/^[#vlrVLR]+/i, '');
        window.location.replace('/acc/' + cleanId);
        return;
      }

      window.location.replace('/index.html');
    })();
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px;">
  <p>Đang chuyển hướng...</p>
</body>
</html>
