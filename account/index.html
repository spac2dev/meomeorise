<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đang chuyển hướng...</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var params = new URLSearchParams(search);
      var id = params.get('id');

      // Bắt trường hợp người dùng gõ /account/VLR2372 trực tiếp
      var match = path.match(/\/account\/([a-zA-Z0-9]+)/i);
      if (match && match[1] && match[1].toLowerCase() !== 'index.html') {
        var pathId = match[1];
        if (!pathId.toUpperCase().startsWith('VLR')) {
          pathId = 'VLR' + pathId;
        }
        params.set('id', pathId);
      } else if (id && !id.toUpperCase().startsWith('VLR')) {
        params.set('id', 'VLR' + id);
      }

      var queryString = params.toString() ? ('?' + params.toString()) : '';
      window.location.replace('../account.html' + queryString);
    })();
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px;">
  <p>Đang chuyển đến trang chi tiết tài khoản...</p>
</body>
</html>
